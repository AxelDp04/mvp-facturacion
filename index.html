<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Facturación MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <header class="bg-blue-600 text-white p-6 rounded-lg shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Sistema de Facturación e Inventario MVP</h1>
        <p class="text-blue-100 text-sm">Práctica Final - MVP</p>
      </div>
      <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded font-semibold hover:bg-blue-50 transition">
        🖨️ Imprimir Factura
      </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Panel de Inventario -->
      <section class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-bold text-gray-800 border-b pb-2">1. Gestión de Inventario</h2>
        
        <form id="formProducto" class="space-y-3">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
            <input type="text" id="nombreProd" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-sm font-medium text-gray-700">Precio (RD$)</label>
              <input type="number" id="precioProd" step="0.01" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Stock Inicial</label>
              <input type="number" id="stockProd" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-semibold hover:bg-green-700 transition">
            Guardar Producto
          </button>
        </form>

        <h3 class="font-semibold text-gray-700 pt-2">Productos Registrados</h3>
        <div class="max-h-48 overflow-y-auto border rounded">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="p-2">Producto</th>
                <th class="p-2">Precio</th>
                <th class="p-2">Stock</th>
              </tr>
            </thead>
            <tbody id="tablaInventario"></tbody>
          </table>
        </div>
      </section>

      <!-- Panel de Facturación -->
      <section class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-bold text-gray-800 border-b pb-2">2. Generar Factura</h2>
        
        <div class="flex gap-2">
          <select id="selectProducto" class="flex-1 border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Seleccione un producto...</option>
          </select>
          <input type="number" id="cantProd" value="1" min="1" class="w-20 border rounded p-2 text-sm text-center">
          <button onclick="agregarAFactura()" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700 transition">
            Agregar
          </button>
        </div>

        <div class="border rounded p-4 bg-gray-50 min-h-[220px] flex flex-col justify-between">
          <table class="w-full text-left text-sm">
            <thead class="border-b">
              <tr>
                <th class="pb-2">Cant.</th>
                <th class="pb-2">Ítem</th>
                <th class="pb-2 text-right">Precio</th>
                <th class="pb-2 text-right">Total</th>
              </tr>
            </thead>
            <tbody id="detalleFactura"></tbody>
          </table>

          <div class="border-t pt-3 mt-4 space-y-1 text-right text-sm">
            <p>Subtotal: <span id="subtotalLabel" class="font-semibold">RD$ 0.00</span></p>
            <p>ITBIS (18%): <span id="itbisLabel" class="font-semibold">RD$ 0.00</span></p>
            <p class="text-base font-bold text-blue-600">Total a Pagar: <span id="totalLabel">RD$ 0.00</span></p>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script>
    let inventario = JSON.parse(localStorage.getItem('mvp_inventario')) || [];
    let itemsFactura = [];

    const formProducto = document.getElementById('formProducto');
    const tablaInventario = document.getElementById('tablaInventario');
    const selectProducto = document.getElementById('selectProducto');
    const detalleFactura = document.getElementById('detalleFactura');

    formProducto.addEventListener('submit', (e) => {
      e.preventDefault();
      const nuevo = {
        id: Date.now(),
        nombre: document.getElementById('nombreProd').value,
        precio: parseFloat(document.getElementById('precioProd').value),
        stock: parseInt(document.getElementById('stockProd').value)
      };
      inventario.push(nuevo);
      localStorage.setItem('mvp_inventario', JSON.stringify(inventario));
      formProducto.reset();
      render();
    });

    function render() {
      tablaInventario.innerHTML = inventario.map(p => `
        <tr class="border-b">
          <td class="p-2">${p.nombre}</td>
          <td class="p-2">RD$ ${p.precio.toFixed(2)}</td>
          <td class="p-2">${p.stock}</td>
        </tr>
      `).join('');

      selectProducto.innerHTML = '<option value="">Seleccione un producto...</option>' + 
        inventario.map(p => `<option value="${p.id}">${p.nombre} - RD$ ${p.precio.toFixed(2)}</option>`).join('');
    }

    function agregarAFactura() {
      const idSelected = selectProducto.value;
      const cant = parseInt(document.getElementById('cantProd').value);
      if (!idSelected || cant <= 0) return;

      const prod = inventario.find(p => p.id == idSelected);
      if (!prod) return;

      itemsFactura.push({ ...prod, cantidad: cant, totalItem: prod.precio * cant });
      renderFactura();
    }

    function renderFactura() {
      detalleFactura.innerHTML = itemsFactura.map(item => `
        <tr class="border-b">
          <td class="py-1">${item.cantidad}</td>
          <td class="py-1">${item.nombre}</td>
          <td class="py-1 text-right">RD$ ${item.precio.toFixed(2)}</td>
          <td class="py-1 text-right">RD$ ${item.totalItem.toFixed(2)}</td>
        </tr>
      `).join('');

      const subtotal = itemsFactura.reduce((sum, item) => sum + item.totalItem, 0);
      const itbis = subtotal * 0.18;
      const total = subtotal + itbis;

      document.getElementById('subtotalLabel').innerText = `RD$ ${subtotal.toFixed(2)}`;
      document.getElementById('itbisLabel').innerText = `RD$ ${itbis.toFixed(2)}`;
      document.getElementById('totalLabel').innerText = `RD$ ${total.toFixed(2)}`;
    }

    render();
  </script>
</body>
</html>
